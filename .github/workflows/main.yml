name: Pull Shark Farmer
on:
  workflow_dispatch: # Allows you to run it manually with a single click

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PR Loop
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          for i in {1..50}
          do
            echo "Merge $i" >> farm.txt
            git add farm.txt
            git commit -m "Feeding the shark $i"
            git push origin main
          done
