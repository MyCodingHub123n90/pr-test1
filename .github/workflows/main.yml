name: Pull Shark Farmer
on:
  workflow_dispatch: # Allows you to run it manually with a single click

permissions:
  contents: write # Double-checks that the runner has write permissions

jobs:
  farm:
    runs-on: ubuntu-24.04 # Fixed to 24.04 to bypass ubuntu-latest migration warnings
    steps:
      - uses: actions/checkout@v4
      - name: Run PR Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Configure remote URL to use the runtime authentication token
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@://github.com{{ github.repository }}.git"
          
          for i in {1..50}
          do
            echo "Merge $i" >> farm.txt
            git add farm.txt
            git commit -m "Feeding the shark $i"
            git push origin main
          done
